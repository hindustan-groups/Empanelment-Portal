name: 🚀 Auto-Deploy to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🧪 Run Frontend & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🏗️ Build Production Bundle
        run: npm run build

  deploy:
    name: 📡 SSH Auto-Deploy to VPS Server
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting Automatic Deployment on VPS..."
            
            if [ -d "/var/www/empanelment-portal" ]; then
              cd /var/www/empanelment-portal
            elif [ -d "/var/www/hipro-backend" ]; then
              cd /var/www/hipro-backend
            else
              cd /var/www/*empanelment* 2>/dev/null || cd /var/www/$(ls /var/www | head -n 1)
            fi
            
            echo "📥 Pulling latest code from GitHub master..."
            git pull origin master --rebase || git pull origin master
            
            echo "📦 Installing Dependencies..."
            npm install
            
            echo "🏗️ Building Frontend Production Assets..."
            npm run build

            echo "📂 Syncing Dist Build to Nginx / Web Root..."
            if [ -d "/var/www/html" ]; then
              cp -rf dist/* /var/www/html/ 2>/dev/null || true
            fi
            if [ -d "/var/www/empanelment.hindustanprojects.in" ]; then
              cp -rf dist/* /var/www/empanelment.hindustanprojects.in/ 2>/dev/null || true
            fi
            if [ -d "/var/www/html/empanelment" ]; then
              cp -rf dist/* /var/www/html/empanelment/ 2>/dev/null || true
            fi
            
            echo "⚙️ Restarting PM2 Backend Server..."
            pm2 restart all || pm2 start backend/server.js --name "hipro-backend"
            
            echo "✅ Auto-Deployment Completed Successfully!"
